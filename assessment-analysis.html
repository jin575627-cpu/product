<script id="assessment-analysis-model">
(()=>{
  const stations=[{key:'lunan',name:'路南供电所',color:'#409eff'},{key:'luxi',name:'路西供电所',color:'#67c23a'},{key:'jinqing',name:'金清供电所',color:'#d97706'},{key:'pengjie',name:'蓬街供电所',color:'#f4c542'},{key:'xinqiao',name:'新桥供电所',color:'#8b6ce8'}],round=(value,digits=2)=>Number(value.toFixed(digits));
  const juneMetrics={avgPrice:[.6668,.686,.6913,.7083,.7079],reductionRate:[1.96,1.48,2.18,-8.61,1.75],feeReductionAmount:[3.06,14.53,65.14,32.39,211],basicFeeShare:[5.82,8.41,11.76,19.62,10.45],basicFeeReductionRate:[12.65,13.21,9.34,5.13,12.32],valleyShare:[26.11,29.25,35.48,42.16,32.74],valleyGrowthRate:[2.59,2.34,3.23,.84,2.96],powerFeeAmount:[9.2,11.8,8.6,121.5,13.4],powerFeeReductionRate:[33.33,31.24,34.05,34.02,30.25],visits:[2,3,1,2,1],actions:[1,2,2,1,3],caseCount:[1,1,2,0,2],caseQuality:[1,2,2,0,3]};
  const monthNames=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
  const makeStations=monthIndex=>stations.map((station,stationIndex)=>{const offset=monthIndex-5,wave=(monthIndex+stationIndex)%3-1,june=monthIndex===5,metric=(key,calc,digits=2)=>june?juneMetrics[key][stationIndex]:round(calc(juneMetrics[key][stationIndex]),digits);return {...station,avgPrice:metric('avgPrice',base=>base+offset*.0032+wave*.0011,4),reductionRate:metric('reductionRate',base=>base+offset*.42+wave*.34),feeReductionAmount:metric('feeReductionAmount',base=>Math.max(.5,base*(1+offset*.055+wave*.025))),basicFeeShare:metric('basicFeeShare',base=>Math.max(1,base+offset*.28+wave*.16)),basicFeeReductionRate:metric('basicFeeReductionRate',base=>base+offset*.58+wave*.3),valleyShare:metric('valleyShare',base=>base+offset*.44+wave*.25),valleyGrowthRate:metric('valleyGrowthRate',base=>base+offset*.23+wave*.16),powerFeeAmount:metric('powerFeeAmount',base=>Math.max(.4,base*(1-offset*.038+wave*.018))),powerFeeReductionRate:metric('powerFeeReductionRate',base=>base+offset*.72+wave*.45),visits:june?juneMetrics.visits[stationIndex]:(monthIndex+stationIndex)%4,actions:june?juneMetrics.actions[stationIndex]:(monthIndex*2+stationIndex+1)%4,caseCount:june?juneMetrics.caseCount[stationIndex]:(monthIndex+stationIndex)%3,caseQuality:june?juneMetrics.caseQuality[stationIndex]:(monthIndex+stationIndex*2)%3}});
  const data={stations,defaultRange:{start:'2026-01',end:'2026-08'},monthly:monthNames.map((ym,index)=>({ym,stations:makeStations(index)}))},sumKeys=new Set(['feeReductionAmount','powerFeeAmount','visits','actions','caseCount','caseQuality']),metricKeys=Object.keys(juneMetrics);
  function aggregateDistrict(month){const district={key:'district',name:'路桥区',color:'#f56c6c',district:true};metricKeys.forEach(key=>{const total=month.stations.reduce((sum,station)=>sum+station[key],0);district[key]=sumKeys.has(key)?round(total):round(total/month.stations.length,key==='avgPrice'?4:2)});return district}
  function normalizeRange(start,end){const min=data.defaultRange.start,max=data.defaultRange.end,clamp=value=>typeof value==='string'&&value>=min&&value<=max?value:(value<min?min:max);let a=clamp(start),b=clamp(end);if(a>b)[a,b]=[b,a];return {start:a,end:b}}
  const defaults={'avg-price':'avgPrice','basic-fee':'basicFeeShare','valley-share':'valleyShare','power-fee':'powerFeeAmount','special':'visits'},options={'avg-price':['avgPrice','reductionRate'],'basic-fee':['basicFeeShare','basicFeeReductionRate'],'valley-share':['valleyShare','valleyGrowthRate'],'power-fee':['powerFeeAmount','powerFeeReductionRate'],'special':['visits','actions','cases']};
  window.__assessmentAnalysisData=data;window.__assessmentAnalysisModel={normalizeRange,filterMonths:(start,end)=>{const range=normalizeRange(start,end);return data.monthly.filter(month=>month.ym>=range.start&&month.ym<=range.end)},aggregateDistrict,withDistrict:month=>month.stations.concat(aggregateDistrict(month)),normalizeChartMetric:(key,value)=>(options[key]||[]).includes(value)?value:defaults[key],normalizeChartScope:value=>value==='district'?'district':'stations',normalizeCaseUnit:value=>stations.some(station=>station.key===value)||value==='district'?value:'lunan',specialChartType:metric=>metric==='cases'?'bar':'line'};
})();
</script>
<script>
(()=>{
  const $=(selector,root=document)=>root.querySelector(selector),data=window.__assessmentAnalysisData,model=window.__assessmentAnalysisModel,app=$('#app'),keys=['avg-price','fee-reduction','basic-fee','valley-share','power-fee','special'],colors=['#409eff','#67c23a','#d97706','#f4c542','#8b6ce8','#f56c6c'];let range={...data.defaultRange},metrics={'avg-price':'avgPrice','basic-fee':'basicFeeShare','valley-share':'valleyShare','power-fee':'powerFeeAmount','special':'visits'},scopes={'fee-reduction':'stations','power-fee':'stations'},caseUnit='lunan';const hidden=Object.fromEntries(keys.map(key=>[key,new Set()]));
  const short=name=>name.replace('供电所',''),lineSeries=(months,metric)=>data.stations.map((station,index)=>({key:station.key,name:short(station.name),color:colors[index],values:months.map(month=>month.stations[index][metric])})).concat({key:'district',name:'路桥区',color:colors[5],values:months.map(month=>model.aggregateDistrict(month)[metric])}),scoped=(months,metric,scope)=>scope==='district'?[{key:'district',name:'路桥区',color:colors[5],values:months.map(month=>model.aggregateDistrict(month)[metric])}]:data.stations.map((station,index)=>({key:station.key,name:short(station.name),color:colors[index],values:months.map(month=>month.stations[index][metric])}));
  function spec(key){const months=model.filterMonths(range.start,range.end),labels=months.map(month=>month.ym.slice(5)+'月');if(key==='avg-price'){const metric=metrics[key];return {months,labels,type:'line',unit:metric==='avgPrice'?'元/kWh':'%',precision:metric==='avgPrice'?4:2,series:lineSeries(months,metric)}}if(key==='fee-reduction')return {months,labels,type:'line',unit:'万元',precision:2,series:scoped(months,'feeReductionAmount',scopes[key])};if(key==='basic-fee'||key==='valley-share'){const metric=metrics[key];return {months,labels,type:'line',unit:'%',precision:2,series:lineSeries(months,metric)}}if(key==='power-fee'){const metric=metrics[key];return {months,labels,type:'line',unit:metric==='powerFeeAmount'?'万元':'%',precision:2,series:scoped(months,metric,scopes[key])}}const metric=metrics.special;if(metric==='cases'){const getUnit=month=>caseUnit==='district'?model.aggregateDistrict(month):month.stations.find(station=>station.key===caseUnit);return {months,labels,type:'bar',unit:'项 / 分',precision:0,series:[{key:'caseCount',name:'典型案例数量',color:colors[0],values:months.map(month=>getUnit(month).caseCount)},{key:'caseQuality',name:'典型案例质量',color:colors[1],values:months.map(month=>getUnit(month).caseQuality)}]}}return {months,labels,type:model.specialChartType(metric),unit:metric==='visits'?'户':'次',precision:0,series:lineSeries(months,metric)}}
  function axis(value,precision){if(precision===4)return value.toFixed(3);if(Math.abs(value)>=100)return String(Math.round(value));return precision===0?String(Math.round(value)):value.toFixed(1)}
  function draw(key){const card=$('[data-chart-key="'+key+'"]'),canvas=$('canvas',card),stage=$('.chart-stage',card),tooltip=$('.chart-tooltip',card),chart=spec(key),visible=chart.series.filter(series=>!hidden[key].has(series.key));$('.chart-unit',card).textContent='单位：'+chart.unit;$('#case-unit').hidden=!(key==='special'&&metrics.special==='cases');$('.chart-legend',card).innerHTML=chart.series.map(series=>'<button type="button" class="legend-btn '+(hidden[key].has(series.key)?'is-muted':'')+'" data-series="'+series.key+'" style="--legend-color:'+series.color+'">'+series.name+'</button>').join('');const rect=stage.getBoundingClientRect(),width=Math.max(260,rect.width),height=Math.max(150,rect.height),dpr=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext('2d');canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);if(!visible.length)return;const margin={left:44,right:12,top:12,bottom:30},plotW=width-margin.left-margin.right,plotH=height-margin.top-margin.bottom,values=visible.flatMap(series=>series.values),rawMin=Math.min(...values),rawMax=Math.max(...values);let min=chart.type==='bar'?Math.min(0,rawMin):rawMin,max=Math.max(0,rawMax);if(chart.type==='line'){const pad=Math.max((rawMax-rawMin)*.16,Math.abs(rawMax||1)*.05);min=rawMin-pad;max=rawMax+pad;if(rawMin>=0)min=Math.max(0,min)}if(max===min)max=min+1;const x=index=>margin.left+(chart.labels.length===1?plotW/2:index*plotW/(chart.labels.length-1)),y=value=>margin.top+(max-value)/(max-min)*plotH;ctx.font='10px Microsoft YaHei';ctx.textBaseline='middle';for(let tick=0;tick<=4;tick++){const value=min+(max-min)*(4-tick)/4,py=margin.top+plotH*tick/4;ctx.strokeStyle='#e6edf4';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(margin.left,py);ctx.lineTo(width-margin.right,py);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#8293a6';ctx.textAlign='right';ctx.fillText(axis(value,chart.precision),margin.left-7,py)}ctx.fillStyle='#72859a';ctx.textAlign='center';chart.labels.forEach((label,index)=>ctx.fillText(label,x(index),height-12));if(chart.type==='bar'){const groupW=Math.min(44,plotW/chart.labels.length*.7),barW=Math.max(2,groupW/visible.length-1);chart.labels.forEach((label,index)=>visible.forEach((series,seriesIndex)=>{const px=x(index)-groupW/2+seriesIndex*(barW+1),py=y(series.values[index]),base=y(0);ctx.fillStyle=series.color;ctx.fillRect(px,Math.min(py,base),barW,Math.max(1,Math.abs(base-py)))}))}else visible.forEach(series=>{ctx.strokeStyle=series.color;ctx.lineWidth=1.8;ctx.beginPath();series.values.forEach((value,index)=>index?ctx.lineTo(x(index),y(value)):ctx.moveTo(x(index),y(value)));ctx.stroke();series.values.forEach((value,index)=>{ctx.fillStyle='#fff';ctx.strokeStyle=series.color;ctx.beginPath();ctx.arc(x(index),y(value),2.5,0,Math.PI*2);ctx.fill();ctx.stroke()})});canvas.__chart={chart,visible,x,margin,plotW,width};tooltip.classList.remove('is-visible')}
  function resizeCharts(){keys.forEach(draw)}function setRange(start,end){range=model.normalizeRange(start,end);$('#range-start').value=range.start;$('#range-end').value=range.end;resizeCharts();return {...range}}function selectChartMetric(key,value){const metric=model.normalizeChartMetric(key,value);if(!metric)return null;metrics[key]=metric;document.querySelectorAll('[data-chart="'+key+'"][data-metric]').forEach(tab=>tab.classList.toggle('is-active',tab.dataset.metric===metric));draw(key);return metric}function selectChartScope(key,value){if(!(key in scopes))return null;const scope=model.normalizeChartScope(value);scopes[key]=scope;document.querySelectorAll('[data-chart="'+key+'"][data-chart-scope]').forEach(tab=>tab.classList.toggle('is-active',tab.dataset.chartScope===scope));draw(key);return scope}function selectCaseUnit(value){caseUnit=model.normalizeCaseUnit(value);$('#case-unit').value=caseUnit;if(metrics.special==='cases')draw('special');return caseUnit}
  document.querySelectorAll('[data-metric]').forEach(tab=>tab.addEventListener('click',()=>selectChartMetric(tab.dataset.chart,tab.dataset.metric)));document.querySelectorAll('[data-chart-scope]').forEach(tab=>tab.addEventListener('click',()=>selectChartScope(tab.dataset.chart,tab.dataset.chartScope)));$('#case-unit').addEventListener('change',event=>selectCaseUnit(event.target.value));$('#range-start').addEventListener('change',()=>setRange($('#range-start').value,$('#range-end').value));$('#range-end').addEventListener('change',()=>setRange($('#range-start').value,$('#range-end').value));document.querySelectorAll('.chart-legend').forEach(legend=>legend.addEventListener('click',event=>{const button=event.target.closest('[data-series]');if(!button)return;const key=button.closest('[data-chart-key]').dataset.chartKey;hidden[key].has(button.dataset.series)?hidden[key].delete(button.dataset.series):hidden[key].add(button.dataset.series);draw(key)}));document.querySelectorAll('canvas').forEach(canvas=>{canvas.addEventListener('mousemove',event=>{const state=canvas.__chart,tooltip=canvas.nextElementSibling;if(!state)return;const rect=canvas.getBoundingClientRect(),mouseX=event.clientX-rect.left,index=Math.max(0,Math.min(state.chart.labels.length-1,Math.round((mouseX-state.margin.left)/Math.max(1,state.plotW)*(state.chart.labels.length-1))));tooltip.innerHTML='<strong>'+state.chart.months[index].ym+'</strong>'+state.visible.map(series=>'<div><span style="color:'+series.color+'">●</span> '+series.name+'：'+series.values[index].toFixed(state.chart.precision)+' '+state.chart.unit+'</div>').join('');tooltip.style.left=Math.min(state.width-196,Math.max(6,mouseX+10))+'px';tooltip.style.top='8px';tooltip.classList.add('is-visible')});canvas.addEventListener('mouseleave',()=>canvas.nextElementSibling.classList.remove('is-visible'))});let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(resizeCharts,100)});$('#collapse-btn').addEventListener('click',()=>{app.classList.toggle('is-collapsed');setTimeout(resizeCharts,240)});$('#menu-btn').addEventListener('click',()=>{innerWidth<=760?app.classList.toggle('mobile-nav-open'):app.classList.toggle('is-collapsed');setTimeout(resizeCharts,240)});$('#mobile-overlay').addEventListener('click',()=>app.classList.remove('mobile-nav-open'));window.__assessmentAnalysis={setRange,selectChartMetric,selectChartScope,selectCaseUnit,resizeCharts};resizeCharts();
})();
