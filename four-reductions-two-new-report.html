    document.querySelectorAll('[data-metric]').forEach(tab=>tab.addEventListener('click',()=>selectChartMetric(tab.dataset.chart,tab.dataset.metric)));document.querySelectorAll('[data-chart-scope]').forEach(tab=>tab.addEventListener('click',()=>selectChartScope(tab.dataset.chart,tab.dataset.chartScope)));$('#case-unit').addEventListener('change',event=>selectCaseUnit(event.target.value));$('#range-start').addEventListener('change',()=>setRange($('#range-start').value,$('#range-end').value));$('#range-end').addEventListener('change',()=>setRange($('#range-start').value,$('#range-end').value));

    document.querySelectorAll('.chart-stage canvas').forEach(canvas=>{canvas.addEventListener('mousemove',event=>{const chart=canvas.__chart,tooltip=canvas.nextElementSibling;if(!chart)return;const rect=canvas.getBoundingClientRect(),mouseX=event.clientX-rect.left,index=Math.max(0,Math.min(chart.spec.labels.length-1,Math.round((mouseX-chart.margin.left)/Math.max(1,chart.plotW)*(chart.spec.labels.length-1)))),rows=chart.visible.map(series=>'<div><span style="color:'+series.color+'">●</span> '+series.name+'：'+series.values[index].toFixed(chart.spec.precision)+' '+chart.spec.unit+'</div>').join('');tooltip.innerHTML='<strong>'+chart.spec.months[index].ym+'</strong>'+rows;tooltip.style.left=Math.min(chart.width-196,Math.max(6,mouseX+10))+'px';tooltip.style.top='8px';tooltip.classList.add('is-visible')});canvas.addEventListener('mouseleave',()=>canvas.nextElementSibling.classList.remove('is-visible'))});
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeCharts,100)});$('#collapse-btn').addEventListener('click',()=>{app.classList.toggle('is-collapsed');setTimeout(resizeCharts,240)});$('#menu-btn').addEventListener('click',()=>{innerWidth<=760?app.classList.toggle('mobile-nav-open'):app.classList.toggle('is-collapsed');setTimeout(resizeCharts,240)});$('#mobile-overlay').addEventListener('click',()=>app.classList.remove('mobile-nav-open'));
    window.__assessmentReport={render,selectView,selectScope,setRange,selectChartMetric,selectChartScope,selectCaseUnit,resizeCharts};render();selectScope('same');selectView('data');
  })();
</script>
